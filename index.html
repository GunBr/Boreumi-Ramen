<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#180c09"><title>보름이의 라면포차 V0.12</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="character-layout.css"></head>
<body><style>.guest-slot>img{width:76px;height:185px;max-width:none;object-fit:cover;object-position:left center}</style><link rel="stylesheet" href="art-v012.css"><div id="viewport"><main id="stage">
  <div class="night"><i class="moon"></i><i class="stars"></i><i class="city"></i></div><div class="stall"><i class="roof"></i><i class="lamps"></i><i class="backwall"></i><i class="counter"></i></div>
  <header class="hud"><div><small>DAY</small><b>1</b></div><div><small>목표 금액</small><b>10,000원</b></div><div class="clock"><small>남은 시간</small><b id="time">01:30</b><i><span id="timeFill"></span></i></div><div><small>현재 매출</small><b id="sales">0원</b></div><div><small>오늘 손님</small><b id="guestCount">0명</b></div><button id="pauseButton">Ⅱ</button></header>
  <aside class="sign"><small>보름이의</small><strong>라면<br>포차</strong></aside>
  <section id="guestRow" class="guest-row"></section>
  <section class="characters"><div id="boreumi" class="boreumi-sprite" data-pose="noodle" role="img" aria-label="요리하는 보름이"></div><div id="boreumiText"></div></section>
  <div id="ppomiPerch" class="ppomi-perch pose-sleep" aria-label="손님 테이블 위의 뽀미"><span class="ppomi-sprite" role="img" aria-label="뽀미"></span><i aria-hidden="true">Zzz</i></div>
  <section id="cookLeft" class="cook-zone left-zone"></section><section id="cookRight" class="cook-zone right-zone"></section>
  <section class="dock"><div class="dock-label"><small>오늘의</small><b>재료</b></div>
    <button class="ingredient" data-item="noodle"><img src="assets/foods/noodle.svg"><span>면</span></button><button class="ingredient" data-item="egg"><img src="assets/foods/egg.svg"><span>계란</span></button>
    <button class="ingredient pictogram" data-item="dumpling"><i>🥟</i><span>군만두</span></button><button class="ingredient pictogram" data-item="oden"><i>🍢</i><span>오뎅</span></button><div class="dock-tip">재료를 조리기구에<br>드래그하세요</div></section>
  <button id="startButton" class="start"><small>DAY 1</small><strong>영업 시작</strong></button><div id="toast"></div>
  <div id="pauseOverlay" class="overlay hidden"><div><h2>일시정지</h2><button id="resumeButton">계속하기</button></div></div>
</main></div><div id="dragGhost"><span></span></div><div class="rotate">가로 모드로 돌려주세요</div><script src="script.js"></script></body></html>
